x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    # Swapped dbt-postgres for dbt-duckdb
    _PIP_ADDITIONAL_REQUIREMENTS: dbt-duckdb
    PYTHONPATH: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    NOAA_API_TOKEN: ${NOAA_API_TOKEN}
    # Storage env vars for DuckDB
    STORAGE_ENDPOINT: http://garage:3900
    STORAGE_BUCKET: weather-lake
    STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
    STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on:
    - airflow-db
    - garage

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  # PostgreSQL Warehouse has been DELETED.

  garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname admin --lastname admin --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  airflow-db-data:
  garage-meta:
  garage-data:
  airflow-logs:
