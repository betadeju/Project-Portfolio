version: 2

models:
  - name: dim_station
    description: One row per weather station.
    columns:
      - name: station_key
        tests:
          - unique
          - not_null
      - name: station_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: Standard date dimension covering the observed data range.
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: date_day
        tests:
          - unique
          - not_null

  - name: fct_observations
    description: >
      One row per station per date. Wide/pivoted format with each reading
      type (max/min temp, precipitation, snowfall) as its own column.
    columns:
      - name: observation_key
        tests:
          - unique
          - not_null
      - name: station_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_station')
              field: station_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
