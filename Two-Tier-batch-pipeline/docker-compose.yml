x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    _PIP_ADDITIONAL_REQUIREMENTS: dbt-postgres
    PYTHONPATH: /opt/airflow 
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    NOAA_API_TOKEN: ${NOAA_API_TOKEN}
    STORAGE_ENDPOINT: http://garage:3900
    STORAGE_BUCKET: ${STORAGE_BUCKET:-weather-raw}
    STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
    STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_DB: ${WAREHOUSE_DB:-weather}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-weather_user}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-change_me}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on:
    - airflow-db
    - warehouse
    - garage

services:
  # Metadata DB for Airflow itself (separate from the analytics warehouse)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  # Analytics warehouse (raw/staging/marts schemas live here)
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-weather_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-change_me}
      POSTGRES_DB: ${WAREHOUSE_DB:-weather}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data

  # S3-compatible object storage standing in for the bronze layer (Garage)
  garage:
    image: dxflrs/garage:v2.4.1 
    command: /garage server  
    ports:
      - "3900:3900" 
      - "3901:3901" 
      - "3902:3902" 
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install -r /opt/airflow/ingestion/../requirements.txt --quiet
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname admin --lastname admin --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  airflow-db-data:
  warehouse-data:
  garage-meta:
  garage-data:
  airflow-logs:
